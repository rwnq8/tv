name: refresh-catalog
on:
  schedule: [{cron: "17 */4 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node build.mjs
      - run: |
          git config user.name "tv-bot"; git config user.email "tv-bot@users.noreply.github.com"
          git add catalog.json && (git diff --cached --quiet || git commit -m "refresh catalog" && git push)
